name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Server tests serve public/, which only the web build produces.
      - name: Build web
        run: pnpm build

      - name: Test server and web
        run: pnpm test

      - name: Typecheck and build server
        run: |
          pnpm typecheck
          pnpm --filter @xiaochao/server build

      - name: Typecheck and test mobile host
        run: |
          pnpm mobile:typecheck
          pnpm --filter @xiaochao/mobile test --maxWorkers=4

      - name: Check release metadata
        run: node -e "const a=require('./announcements.json');if(!Array.isArray(a))throw new Error('announcements.json must be an array')"
