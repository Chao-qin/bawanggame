name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The app's update check compares its build with package.json on main (apps/web/src/updates.js).
      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version; bump the version on main before tagging." >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare MRP runtime assets
        run: |
          git clone --filter=blob:none https://github.com/vmrp/vmrp.github.io.git maopao-revival/vendor/vmrp.github.io
          git -C maopao-revival/vendor/vmrp.github.io checkout 7f96c715244adaea927eb8f60d9319160a767e5a
          ln -s ../../hall maopao-revival/vendor/vmrp.github.io/hall

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in repository Actions secrets." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signed release APK
        env:
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          # Usage statistics endpoint (docs/superpowers/specs/2026-11-24-usage-analytics-design.md); unset leaves them off.
          VITE_ANALYTICS_URL: ${{ vars.ANALYTICS_URL }}
        run: pnpm mobile:build-android

      - name: Verify APK signature
        run: |
          build_tools_version=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$build_tools_version/apksigner" verify apps/mobile/android/app/build/outputs/apk/release/app-release.apk

      # The fixed-name copy keeps releases/latest/download/xiaochao-bawang.apk valid for the in-app download link.
      # The site archive is the static web package the APK build produced (pnpm pack → site-deploy/).
      - name: Package release assets
        run: |
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          cp "$apk" "xiaochao-bawang-${GITHUB_REF_NAME}.apk"
          cp "$apk" xiaochao-bawang.apk
          tar -czf "xiaochao-bawang-site-${GITHUB_REF_NAME}.tar.gz" -C site-deploy .
          sha256sum "xiaochao-bawang-${GITHUB_REF_NAME}.apk" xiaochao-bawang.apk "xiaochao-bawang-site-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            xiaochao-bawang-${{ github.ref_name }}.apk
            xiaochao-bawang.apk
            xiaochao-bawang-site-${{ github.ref_name }}.tar.gz
            SHA256SUMS
