services:
  web:
    build: .
    init: true
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    environment:
      TURN: "0"
      LOG_ENV: "${LOG_ENV:-production}"
      LOG_DIR: /app/.data/reporting
      FEISHU_APP_ID: "${FEISHU_APP_ID:-}"
      FEISHU_APP_SECRET: "${FEISHU_APP_SECRET:-}"
      FEISHU_SPREADSHEET_TOKEN: "${FEISHU_SPREADSHEET_TOKEN:-}"
      FEISHU_USAGE_SHEET_ID: "${FEISHU_USAGE_SHEET_ID:-}"
      FEISHU_ERROR_SHEET_ID: "${FEISHU_ERROR_SHEET_ID:-}"
      FEISHU_SERVER_SHEET_ID: "${FEISHU_SERVER_SHEET_ID:-}"
      FEISHU_SESSION_SHEET_ID: "${FEISHU_SESSION_SHEET_ID:-}"
    volumes:
      - reporting-logs:/app/.data/reporting
      - type: bind
        source: ./games/jar
        target: /app/games/jar
        read_only: true
        bind:
          create_host_path: false

volumes:
  reporting-logs:
