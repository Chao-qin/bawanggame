services:
  web:
    build: .
    init: true
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    environment:
      TURN: "0"
    volumes:
      - type: bind
        source: ./games/jar
        target: /app/games/jar
        read_only: true
        bind:
          create_host_path: false
